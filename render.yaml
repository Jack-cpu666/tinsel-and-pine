# Render Blueprint: the store's web service.
# The store shares the existing "eidren-db" Postgres but keeps every table in its
# own "tinselpine" schema, so it never touches the other app's data.
services:
  - type: web
    name: tinsel-and-pine
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.22.0
      - key: APP_SECRET
        generateValue: true
      - key: DB_SCHEMA
        value: tinselpine
      - key: DATABASE_URL
        fromDatabase:
          name: eidren-db
          property: connectionString
